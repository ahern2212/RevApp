# Native app builds on EAS. Run manually from the Actions tab, or push a tag
# like v1.2.0 to build production iOS + Android binaries.
#
# Needs the EXPO_TOKEN repository secret. EXPO_PUBLIC_* values for native
# builds are read from EAS environment variables (expo.dev → project →
# Environment variables), not from GitHub.
name: EAS Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile from eas.json
        type: choice
        options: [production, preview, development]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [all, android, ios]
        default: all
      submit:
        description: Submit to the stores when the build finishes (production only)
        type: boolean
        default: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: EAS build
    needs: ci
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ inputs.profile || 'production' }}
      PLATFORM: ${{ inputs.platform || 'all' }}
      SUBMIT: ${{ inputs.submit && '--auto-submit' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # --no-wait: the build runs on EAS servers; follow it on expo.dev instead
      # of paying for an idle GitHub runner.
      - name: Start build
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait $SUBMIT
