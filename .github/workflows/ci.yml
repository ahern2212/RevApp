# Continuous integration: lint, type-check, unit tests and a web build on every
# pull request. Pushes to main run it through deploy.yml, which gates on it.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static rendering evaluates lib/supabase.ts at build time, so it needs
      # values; placeholders are enough to prove the site builds.
      - name: Export web bundle
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder

      # Signs up and signs in on that build in headless Chrome (preinstalled on the
      # runner), tapping each field like a person would, with Supabase mocked.
      - name: Sign-in screen tests
        run: npm run test:web
